services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: fsp
      POSTGRES_USER: fsp
      POSTGRES_PASSWORD: fsp
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fsp -d fsp"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: ./backend
    environment:
      APP_ENV: dev
      DATABASE_URL: postgresql+asyncpg://fsp:fsp@db:5432/fsp
      JWT_SECRET: dev-only-change-me
      FRONTEND_URL: http://localhost:5173
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
  web:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [api]
  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    command: start-dev --http-port=8080
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports: ["8080:8080"]
volumes:
  pgdata:
